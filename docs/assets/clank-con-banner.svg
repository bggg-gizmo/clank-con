 <text x="101" y="47" font-size="13" letter-spacing="2" fill="#78ab87">BGG / LOCAL ARCHIVE TERMINAL</text>
 <text x="1155" y="47" font-size="13" text-anchor="end" fill="#88ffae">BUILD 0.1.1 // DEVICE TEST</text>
 <path d="M35 63H1165 M35 369H1165" stroke="#285638"/>
 <text x="64" y="115" font-size="15" letter-spacing="4" fill="#7cbc91">BACKGROUND GREMLIN GROUP PRESENTS</text>
 <text x="58" y="200" font-size="82" font-weight="bold" letter-spacing="3" fill="#aaffbd">CLANK-CON</text>
 <text x="64" y="246" font-size="27" font-weight="bold" fill="#e2ffea">PULL CHATS FROM CLANKS.</text>
 <text x="64" y="285" font-size="18" fill="#83b995">Your conversations. Your archives. Your device.</text>
 <text x="64" y="327" font-size="15" fill="#88ffae">[ 08 PROVIDER TARGETS ]   [ 07 EXPORT FORMATS ]   [ MIT ]</text>
 <text x="40" y="398" font-size="14" fill="#9cdda9">DON'T TRUST US. AUDIT THE CODE.</text>
 <text x="1157" y="398" font-size="14" text-anchor="end" fill="#78ab87">ANDROID / NATIVE JAVA / NO GRADLE</text>
</g>
