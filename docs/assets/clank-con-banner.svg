<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Clank-Con — Background Gremlin Group</title>
<desc id="desc">Green phosphor CRT terminal with a robot taking notes, and the motto Pull chats from clanks.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07150e"/><stop offset="1" stop-color="#020805"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#1e7943" stop-opacity=".22"/><stop offset="1" stop-color="#08120b" stop-opacity="0"/></radialGradient>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#a4ffb9" stroke-opacity=".055"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="438" rx="24" fill="#030705" stroke="#31563d" stroke-width="2"/>
